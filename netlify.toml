# Serve policy HTML files directly as static files (must come before the catch-all)
[[redirects]]
  from = "/Privacy_Policy.html"
  to = "/Privacy_Policy.html"
  status = 200

[[redirects]]
  from = "/Terms_and_Conditions.html"
  to = "/Terms_and_Conditions.html"
  status = 200

# Catch-all — send everything else through the React app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
