<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting to Skootlink…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .card {
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.125rem; font-weight: 600; color: #0f172a; margin-bottom: 0.5rem; }
    p  { font-size: 0.875rem; color: #64748b; line-height: 1.5; }
    .fallback { display: none; margin-top: 1.5rem; }
    .fallback p { font-size: 0.8rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="heading">Redirecting to Skootlink…</h1>
    <p id="subtext">Taking you back to the app.</p>
    <div class="fallback" id="fallback">
      <p>
        If the app did not open automatically, please switch back to the
        Skootlink app manually. Your payment has been recorded.
      </p>
    </div>
  </div>

  <script>
    // Forward ALL query params PayFast placed on this URL into the deep link.
    // window.location.search is e.g.:
    //   ?status=success&category=credits&package=starter
    //   ?status=cancelled&category=verification&service=sa_id
    //
    // App.jsx's appUrlOpen listener parses the deep link, writes the result to
    // sessionStorage AND dispatches a 'skootlink:payment-result' window event.
    // Credits.jsx and VerificationPanel.jsx both listen for that event and act
    // on it immediately — the category + package/service params in the query
    // string are what tell each component whether the result belongs to it.
    var deepLink = 'co.za.skootlink.app://payment-result' + window.location.search;

    // Navigate to the deep link. On Android the OS intercepts the intent and
    // switches to the app. On iOS the OS intercepts the custom scheme and
    // switches to the app; App.jsx then calls Browser.close() which dismisses
    // the SFSafariViewController, completing the round-trip.
    window.location.href = deepLink;

    // Show a fallback message after 3 s in case the deep link didn't fire
    // (e.g. app not installed, or the user opened this URL in a desktop browser).
    setTimeout(function () {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('heading').textContent = 'Payment complete';
      document.getElementById('subtext').textContent = 'You can close this tab and return to the Skootlink app.';
      document.getElementById('fallback').style.display = 'block';
    }, 3000);
  </script>
</body>
</html>
