<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Returning to Skootlink…</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #f4f4f5;
    color: #09090b;
    text-align: center;
    padding: 24px;
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 4px solid rgba(37,99,235,0.15);
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #71717a; font-size: 15px; }
</style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p id="msg">Returning to Skootlink…</p>
  </div>

  <script>
    // PayFast lands here with e.g. ?status=success&category=credits&package=standard
    // or ?status=cancelled&category=verification&service=sa_id
    var params = window.location.search;
    var qs = new URLSearchParams(params);
    var status = qs.get('status');
    var category = qs.get('category');
    var service = qs.get('service');

    // Try the native deep link first — if the app is installed, the OS
    // intercepts this before the fallback below ever fires.
    var deepLink = 'co.za.skootlink.app://payment-result' + params;
    window.location.href = deepLink;

    // Fallback for web/desktop users (no app to catch the deep link) —
    // send them to the same page + toast logic that already existed before
    // this bridge page was introduced.
    setTimeout(function () {
      var fallbackUrl;
      if (category === 'verification') {
        fallbackUrl = '/profile?verif_payment=' + encodeURIComponent(status) +
          (service ? '&service=' + encodeURIComponent(service) : '');
      } else {
        fallbackUrl = '/credits?payment=' + encodeURIComponent(status);
      }
      document.getElementById('msg').textContent = 'Redirecting…';
      window.location.href = fallbackUrl;
    }, 1500);
  </script>
</body>
</html>
