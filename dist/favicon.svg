<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#6d28d9"/>
  <!-- Scooter / bike wheel left -->
  <circle cx="28" cy="65" r="11" fill="none" stroke="white" stroke-width="5"/>
  <!-- Scooter / bike wheel right -->
  <circle cx="72" cy="65" r="11" fill="none" stroke="white" stroke-width="5"/>
  <!-- Frame -->
  <polyline points="28,65 45,38 58,38 72,65" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round"/>
  <!-- Seat post -->
  <line x1="45" y1="38" x2="40" y2="50" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Handlebar -->
  <line x1="58" y1="38" x2="66" y2="33" stroke="white" stroke-width="5" stroke-linecap="round"/>
</svg>
